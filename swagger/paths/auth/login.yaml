tags:
  - Auth
summary: Login user
operationId: loginUser
description: Login user
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - password
          - email
        properties:
          email:
            type: string
            description: User email
            example: andriy7@example.com
          password:
            type: string
            description: User password
            example: 123456789
responses:
  '200':
    description: User login
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              $ref: ../../components/schemas/user.yaml
  '401':
    description: Unauthorized Error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Email or password is incorrect

  '500':
    $ref: ../../components/responses/500.yaml
