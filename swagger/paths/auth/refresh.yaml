tags:
  - Auth
summary: Refresh token user
operationId: refreshUser
description: Refresh token user
security: []
responses:
  '200':
    description: Refresh token
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Refresh completed successfully
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  description: Refresh Token for access
                  example: gVENsCutuSsG14QPBOiuk2+JzBn0g5LG5T+jMIFR
  '401':
    description: Unauthorized Error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Session not found | Refresh token is invalid | Refresh token is expired

  '500':
    $ref: ../../components/responses/500.yaml
