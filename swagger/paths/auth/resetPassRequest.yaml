tags:
  - Auth
summary: Reques for reset password
operationId: reqResetPass
description: Reques for reset password
security: []
responses:
  '200':
    description: Reques for reset password
    content:
      application/json:
        schema:
          type: object
          required:
            - email
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    $ref: ../../components/responses/404.yaml
  '500':
    description: Internal Server Error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: Failed to send the email, please try again later
