type: object
required:
  - page
  - perPage
  - totalItems
  - totalPages
  - hasPreviousPage
  - hasNextPage
properties:
  data:
    type: array
    description: Array of contacts
    items:
      $ref: './contact.yaml'

  page:
    type: integer
    description: Number of page
    example: 2
  perPage:
    type: integer
    description: Count of contacts on one page
    example: 10
  totalItems:
    type: integer
    description: Count of contacts with given parameters in DB
    example: 200
  totalPages:
    type: integer
    description: Count of page with contacts with given parameters
    example: 20
  hasPreviousPage:
    type: boolean
    description: Have this page the previous page?
    example: false
  hasNextPage:
    type: boolean
    description: Have this page the next page?
    example: true
