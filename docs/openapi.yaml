openapi: 3.1.0
info:
  version: 1.0.0
  title: Contact management App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: Contact management App
tags:
  - name: Contacts
    description: Operation with contact
  - name: Auth
    description: Auth operations
servers:
  - url: http://127.0.0.1:3000
  # - url: #посилання на задеплоєний сайт
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/getAll.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{id}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
  /auth/register:
    post:
      $ref: ../swagger/paths/auth/register.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auth/login.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/logout.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/auth/refresh.yaml
  /auth/send-reset-email:
    post:
      $ref: ../swagger/paths/auth/resetPassRequest.yaml
  /auth/reset-pwd:
    post:
      $ref: ../swagger/paths/auth/resetPass.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
